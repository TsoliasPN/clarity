name: Feature request
description: Propose a new capability or product improvement.
title: "feat: "
labels:
  - enhancement
  - scope:shared
body:
  - type: markdown
    attributes:
      value: |
        Search GitHub first, then reuse or create an issue with a milestone.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - frontend
        - api
        - db
        - auth
        - infra
        - docs
        - shared
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Value
      description: Why does this matter?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be true when this is done?
    validations:
      required: true
